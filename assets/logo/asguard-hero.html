<style>
        .grid-bg {
            background-size: 40px 40px;
            opacity: 0.15;
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        }
        
        .pulse-slow {
            animation: pulse-op 4s infinite alternate ease-in-out;
        }
        
        @keyframes pulse-op {
            0% { opacity: 0.8; }
            100% { opacity: 1; filter: drop-shadow(0 0 12px rgba(233, 180, 76, 0.4)); }
        }

        .reveal-up {
            opacity: 0;
            transform: translateY(20px);
            animation: revealUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }

        @keyframes revealUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

        </h1>
<!-- Divider -->
<div class="reveal-up delay-200 w-full max-w-[320px] h-hairline bg-secondary/30 mt-2 mb-2 relative overflow-hidden">
<!-- Subtle scanner effect on divider -->
<div class="absolute top-0 left-0 h-full w-1/4 bg-secondary/80 translate-x-[-100%] animate-[scan_3s_ease-in-out_infinite]"></div>
</div>
<!-- Tagline -->
<p class="reveal-up delay-300 font-badge text-text-primary text-center tracking-widest uppercase opacity-80">
            BIDIRECTIONAL <span class="text-secondary font-bold">AI</span> SECURITY FIREWALL
        </p>
</div>
<style>
        @keyframes scan {
            0% { transform: translateX(-100%); opacity: 0; }
