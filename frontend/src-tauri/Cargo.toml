[package]
name = "asguard"
version = "0.1.0"
description = "ASGuard — Bidirectional AI Security Firewall (desktop console)"
authors = ["ASGuard"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "asguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# --- size / memory optimizations (small binary, low RAM footprint) ---
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
